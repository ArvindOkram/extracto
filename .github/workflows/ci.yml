name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,api,postgres]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  postgres:
    # Runs the storage, crawl, and API tests against real Postgres (production uses Neon).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: extracto
          POSTGRES_PASSWORD: extracto
          POSTGRES_DB: extracto_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U extracto" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://extracto:extracto@localhost:5432/extracto_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,api,postgres]"
      - run: pytest -q tests/unit/test_storage_db.py tests/unit/test_storage_repositories.py tests/integration
