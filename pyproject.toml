[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "extracto"
version = "0.1.0"
description = "Polite crawler that watches a fixed set of websites and tells marketing what changed."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "selectolax>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "tenacity>=8.3",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
js = ["playwright>=1.45"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
postgres = ["psycopg[binary]>=3.2"]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[project.scripts]
extracto = "extracto.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/extracto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Starlette's TestClient nags about httpx vs httpx2; irrelevant to our tests.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations contain long CHECK constraint strings.
"src/extracto/adapters/storage/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
