# For developer use (`alembic revision --autogenerate`, `alembic upgrade head`).
# The database URL comes from DATABASE_URL / DATA_DIR (see .env.example), not this file.
# Migrations live inside the package so they ship with installs and the Docker image.
[alembic]
script_location = src/extracto/adapters/storage/migrations
file_template = %%(rev)s_%%(slug)s
